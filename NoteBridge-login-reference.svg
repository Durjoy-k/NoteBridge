<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#342184"/><stop offset="1" stop-color="#7650E4"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5B35C8"/><stop offset="1" stop-color="#7B55E8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#322567" flood-opacity=".14"/></filter>
    <style>.font{font-family:Inter,Arial,sans-serif}.white{fill:#fff}.ink{fill:#18223B}.muted{fill:#69748F}.purple{fill:#5B35C8}.label{font-size:13px;font-weight:650}.small{font-size:12px}</style>
  </defs>
  <rect width="1440" height="900" fill="#F8F9FD"/>
  <rect width="610" height="900" fill="url(#left)"/>
  <g opacity=".13" fill="none" stroke="white"><circle cx="470" cy="110" r="180" stroke-width="2"/><circle cx="470" cy="110" r="235" stroke-width="2"/><circle cx="120" cy="820" r="200" stroke-width="2"/></g>
  <g opacity=".12" fill="white"><circle cx="46" cy="52" r="2"/><circle cx="86" cy="52" r="2"/><circle cx="126" cy="52" r="2"/><circle cx="166" cy="52" r="2"/><circle cx="206" cy="52" r="2"/><circle cx="246" cy="52" r="2"/><circle cx="286" cy="52" r="2"/><circle cx="326" cy="52" r="2"/><circle cx="366" cy="52" r="2"/><circle cx="406" cy="52" r="2"/><circle cx="446" cy="52" r="2"/><circle cx="486" cy="52" r="2"/><circle cx="526" cy="52" r="2"/><circle cx="566" cy="52" r="2"/></g>
  <!-- brand -->
  <rect x="74" y="56" width="42" height="42" rx="13" fill="white" fill-opacity=".18"/><path d="M81 67h10c3 0 6 1 8 3v16c-2-1-5-2-8-2H81V67Z" fill="white"/><path d="M99 70c2-2 5-3 8-3h7v17h-7c-3 0-6 1-8 2V70Z" fill="white"/><path d="M98 70v16" stroke="#6C45D4" stroke-width="2"/><text x="132" y="85" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="white">NoteBridge</text>
  <g class="font white"><text x="74" y="310" font-size="15" font-weight="700" fill="#DED6FF">WELCOME TO NOTEBRIDGE</text><text x="74" y="370" font-size="48" font-weight="800">Share what you know.</text><text x="74" y="426" font-size="48" font-weight="800">Find what you need.</text><text x="74" y="482" font-size="17" fill="#E4DFFF">A trusted university space for shared notes,</text><text x="74" y="510" font-size="17" fill="#E4DFFF">useful resources, and smarter study support.</text><rect x="74" y="624" width="42" height="42" rx="14" fill="white" fill-opacity=".17"/><path d="M86 636h8c3 0 6 1 8 4v14c-2-2-5-3-8-3h-8v-15Zm16 4c2-3 5-4 8-4h3v15h-3c-3 0-6 1-8 3v-14Z" fill="white"/><text x="132" y="646" font-size="14" font-weight="700">Built for student communities</text><text x="132" y="669" font-size="12" fill="#E4DFFF">Share resources that help the next student.</text></g>
  <g filter="url(#shadow)"><rect x="825" y="96" width="470" height="708" rx="24" fill="white"/></g>
  <g class="font"><text x="875" y="166" class="ink" font-size="30" font-weight="800">Welcome back</text><text x="875" y="197" class="muted" font-size="15">Sign in to continue to your university space.</text><text x="875" y="258" class="ink label">University email</text><rect x="875" y="274" width="370" height="52" rx="12" fill="white" stroke="#D9DFEC"/><text x="895" y="306" class="muted" font-size="14">student@university.edu</text><text x="875" y="372" class="ink label">Password</text><rect x="875" y="388" width="370" height="52" rx="12" fill="white" stroke="#D9DFEC"/><text x="895" y="420" class="muted" font-size="20">••••••••••</text><text x="1180" y="468" class="purple small" font-weight="700">Forgot password?</text><rect x="875" y="500" width="370" height="54" rx="13" fill="url(#button)"/><text x="1038" y="534" fill="white" class="label" text-anchor="middle">Sign in</text><line x1="875" y1="592" x2="1025" y2="592" stroke="#E5E8F0"/><text x="1050" y="597" class="muted small" text-anchor="middle">or continue with</text><line x1="1075" y1="592" x2="1245" y2="592" stroke="#E5E8F0"/><rect x="875" y="620" width="370" height="52" rx="12" fill="white" stroke="#D9DFEC"/><circle cx="1006" cy="646" r="10" fill="#4285F4"/><text x="1028" y="651" class="ink label">Continue with Google</text><text x="942" y="737" class="muted small">New to NoteBridge?</text><text x="1060" y="737" class="purple small" font-weight="700">Create an account</text></g>
</svg>
